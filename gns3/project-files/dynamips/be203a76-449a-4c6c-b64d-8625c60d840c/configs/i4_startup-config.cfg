!
! ADMIN: Project 3 (NAT + DHCP) reference configuration.
! Written in 2026 from the GNS3 topology and the project proposal; the
! configs used for the original submission were never committed.
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname ADMIN
!
ip cef
no ip domain lookup
no ipv6 cef
!
! DHCP for the Administrative LAN (router keeps .1)
ip dhcp excluded-address 169.110.226.1
ip dhcp pool ADMIN_LAN
 network 169.110.226.0 255.255.255.192
 default-router 169.110.226.1
 dns-server 8.8.8.8 1.1.1.1
!
interface FastEthernet0/0
 description Uplink to GNS3 NAT node (address + default route via DHCP)
 ip address dhcp
 ip nat outside
 no shutdown
!
interface FastEthernet1/0
 description Administrative LAN
 ip address 169.110.226.1 255.255.255.192
 ip nat inside
 no shutdown
!
interface Serial5/0
 description Link to CSE Serial5/0
 ip address 169.110.226.162 255.255.255.252
 no shutdown
!
interface Serial5/1
 description Link to ELL Serial5/1
 ip address 169.110.226.182 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 4.4.4.4
 passive-interface FastEthernet1/0
 network 169.110.226.0 0.0.0.63 area 0
 network 169.110.226.160 0.0.0.3 area 0
 network 169.110.226.180 0.0.0.3 area 0
!
! PAT: translate the Administrative LAN to the uplink address
access-list 1 permit 169.110.226.0 0.0.0.63
ip nat inside source list 1 interface FastEthernet0/0 overload
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
!
end
