!
! ELL: Project 3 (NAT + DHCP) reference configuration.
! Written in 2026 from the GNS3 topology and the project proposal; the
! configs used for the original submission were never committed.
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname ELL
!
ip cef
no ip domain lookup
no ipv6 cef
!
! DHCP for the ELL LAN (router keeps .65)
ip dhcp excluded-address 169.110.226.65
ip dhcp pool ELL_LAN
 network 169.110.226.64 255.255.255.192
 default-router 169.110.226.65
 dns-server 8.8.8.8 1.1.1.1
!
interface FastEthernet0/0
 description Uplink to GNS3 NAT node (address + default route via DHCP)
 ip address dhcp
 ip nat outside
 no shutdown
!
interface FastEthernet1/0
 description ELL LAN
 ip address 169.110.226.65 255.255.255.192
 ip nat inside
 no shutdown
!
interface Serial5/0
 description Link to CIVIL Serial5/1
 ip address 169.110.226.178 255.255.255.252
 no shutdown
!
interface Serial5/1
 description Link to ADMIN Serial5/1
 ip address 169.110.226.181 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 5.5.5.5
 passive-interface FastEthernet1/0
 network 169.110.226.64 0.0.0.63 area 0
 network 169.110.226.176 0.0.0.3 area 0
 network 169.110.226.180 0.0.0.3 area 0
!
! PAT: translate the ELL LAN to the uplink address
access-list 1 permit 169.110.226.64 0.0.0.63
ip nat inside source list 1 interface FastEthernet0/0 overload
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
!
end
