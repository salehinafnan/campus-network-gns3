!
! CSE: Project 3 (NAT + DHCP) reference configuration.
! Written in 2026 from the GNS3 topology and the project proposal; the
! configs used for the original submission were never committed.
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname CSE
!
ip cef
no ip domain lookup
no ipv6 cef
!
! DHCP for the CSE LAN (router keeps .1)
ip dhcp excluded-address 169.110.224.1
ip dhcp pool CSE_LAN
 network 169.110.224.0 255.255.255.0
 default-router 169.110.224.1
 dns-server 8.8.8.8 1.1.1.1
!
interface FastEthernet0/0
 description Uplink to GNS3 NAT node (address + default route via DHCP)
 ip address dhcp
 ip nat outside
 no shutdown
!
interface FastEthernet1/0
 description CSE LAN
 ip address 169.110.224.1 255.255.255.0
 ip nat inside
 no shutdown
!
interface Serial5/0
 description Link to ADMIN Serial5/0
 ip address 169.110.226.161 255.255.255.252
 no shutdown
!
interface Serial5/1
 description Link to EEE Serial5/0
 ip address 169.110.226.165 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 passive-interface FastEthernet1/0
 network 169.110.224.0 0.0.0.255 area 0
 network 169.110.226.160 0.0.0.3 area 0
 network 169.110.226.164 0.0.0.3 area 0
!
! PAT: translate the CSE LAN to the uplink address
access-list 1 permit 169.110.224.0 0.0.0.255
ip nat inside source list 1 interface FastEthernet0/0 overload
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
!
end
